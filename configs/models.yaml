# Model Configurations and Hyperparameter Search Grids
# Matches PRD Section 8 & Section 11

models:
  logistic_regression:
    name: "Logistic Regression"
    default_params:
      C: 1.0
      solver: "lbfgs"
      max_iter: 1000
      random_state: 42
    param_grid:
      model__C: [0.01, 0.1, 1.0, 10.0]
      model__penalty: ["l2"]

  random_forest:
    name: "Random Forest"
    default_params:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 2
      random_state: 42
    param_grid:
      model__n_estimators: [100, 200, 300]
      model__max_depth: [5, 10, 15, null]
      model__min_samples_split: [2, 5]

  svm:
    name: "Support Vector Machine"
    default_params:
      kernel: "rbf"
      C: 1.0
      gamma: "scale"
      probability: true
      random_state: 42
    param_grid:
      model__C: [0.1, 1.0, 10.0]
      model__gamma: ["scale", "auto", 0.01, 0.1]

  knn:
    name: "K-Nearest Neighbors"
    default_params:
      n_neighbors: 7
      weights: "uniform"
      metric: "minkowski"
    param_grid:
      model__n_neighbors: [3, 5, 7, 9, 11]
      model__weights: ["uniform", "distance"]

  gradient_boosting:
    name: "Gradient Boosting"
    default_params:
      n_estimators: 200
      learning_rate: 0.1
      max_depth: 2
      random_state: 42
    param_grid:
      model__n_estimators: [100, 200]
      model__learning_rate: [0.05, 0.1, 0.2]
      model__max_depth: [2, 3, 4]
